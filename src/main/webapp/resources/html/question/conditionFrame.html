<div class="accordion-item condition-ac">
  <input type="hidden" name="conditionId">
  <h2 class="accordion-header condition-ac-header">
    <button class="accordion-button" type="button">
      <span class="arrow">▶</span> 조건 <span class="con-order"> 1 </span>
    </button>


  </h2>
  <div class="accordion-collapse">
    <div class="accordion-body condition-ac-body">
      <div class="condition-if">
        <div class="mb-2 fw-bold">응답</div>
        <select class="form-select mb-2 contition-option-se">
          <!-- 객관식 옵션 들어갈 자리 -->
        </select>
        <select class="form-select mb-2 condition-oper">
          <option value="같음">같음</option>
          <option value="같지않음">같지않음</option>
        </select>
      </div>
      <div class="condition-then">
        <div class="mb-1 fw-bold">응답에 따른 질문</div>
        <!-- <div class="fs-6 mb-2">이어지는 질문</div> -->
        <select class="form-select contition-next-se">
          <!-- 이어질 질문 들어갈 자리 -->
        </select>
      </div>
      <div class="ac-x-btn j-flex-row-center">
        <span>조건 삭제</span>
        <img src="/resources/img/question/x-circle-red.png">
      </div>
    </div>
  </div>
</div>
